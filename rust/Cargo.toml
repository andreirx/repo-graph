# ── repo-graph Rust workspace ─────────────────────────────────────
#
# This workspace is the Rust product: the daemon (`rmapd`), the
# `rmap` CLI, and the extraction / indexing / storage substrate
# plus the SCIP-first LiveGraph runtime.
#
# History: the workspace began as the Rust track of a
# prototype-then-port effort — a TypeScript prototype defined
# contracts that matching Rust slices ported, verified against a
# shared cross-runtime `parity-fixtures/` corpus at the repo root.
# That TypeScript prototype and its parity corpus were retired
# (TS-PROTOTYPE-RETIREMENT-1; see `docs/ts-prototype.md`); the Rust
# workspace is now the sole implementation.
#
# Workspace resolver "2" is required for >= Rust 2021 edition.

[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/artifact-contracts",
    "crates/boundary-interaction",
    "crates/contract-schema",
    "crates/boundary-interaction-extractor",
    "crates/c-extractor",
    "crates/classification",
    "crates/cpp-extractor",
    "crates/coverage",
    "crates/daemon-policy",
    "crates/daemon-runtime",
    "crates/daemon-transport",
    "crates/detectors",
    "crates/doc-facts",
    "crates/enrichment",
    "crates/gate",
    "crates/git",
    "crates/graph-algorithms",
    "crates/indexer",
    "crates/java-extractor",
    "crates/jdtls-resolver",
    "crates/lsp-subprocess",
    "crates/module-queries",
    "crates/platform-paths",
    "crates/policy-facts",
    "crates/proto-parser",
    "crates/python-extractor",
    "crates/quality-policy",
    "crates/quality-policy-runner",
    "crates/repo-graph-ir",
    "crates/repo-graph-import-resolver",
    "crates/repo-graph-scip-ingest",
    "crates/repo-graph-seed",
    "crates/repo-graph-trust-model",
    "crates/repo-graph-coherence",
    "crates/repo-graph-livegraph",
    "crates/repo-graph-livegraph-feed",
    "crates/repo-graph-warm-cache",
    "crates/repo-graph-warm-cache-feed",
    "crates/repo-index",
    "crates/rgr",
    "crates/rmapd",
    "crates/rust-analyzer-resolver",
    "crates/rust-extractor",
    "crates/state-bindings",
    "crates/state-extractor",
    "crates/storage",
    "crates/trust",
    "crates/ts-extractor",
    "crates/tsserver-resolver",
    # Research / probe tooling (non-production; rust/tools).
    "tools/cjoin-probe",
    "tools/xpart-probe",
    "tools/refresh-probe",
    "tools/rust-ingest-probe",
]

# ── Workspace Package Metadata ─────────────────────────────────────
#
# Canonical version for all release-bearing crates. Version changes
# happen only through release-cut scripts, never during builds.
#
# Release crates (rgr, rmapd, daemon-runtime) use version.workspace = true.
# Internal crates may also inherit for consistency.
#
# See: docs/slices/rel-support-1-version-authority.md

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.93.0"
license = "MIT"
repository = "https://github.com/andreirx/repo-graph"

# Shared profile settings: optimize for correctness and clear errors
# during the prototype-then-port phase, not raw speed.
[profile.dev]
debug = true

[profile.release]
debug = "line-tables-only"
lto = "thin"
