[package]
name = "rust-analyzer-resolver"
version = "0.1.0"
edition = "2021"
description = "Rust receiver type resolver using rust-analyzer LSP"

[dependencies]
# Shared LSP subprocess transport
lsp-subprocess = { path = "../lsp-subprocess" }

# LSP protocol types (request/response structs)
lsp-types = "0.95"

# Serialization for LSP JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Enrichment contracts (ReceiverTypeResolver trait, DTOs)
enrichment = { path = "../enrichment" }

# Logging (optional, for debugging)
tracing = "0.1"

# tree-sitter — syntax-based receiver expression localization for compound
# receiver shapes (`self.field.method` / `this.field.method`), routed by receiver
# SHAPE (client::needs_receiver_locator), NOT the wildcard category: Rust's
# `self.field.method` carries the object-method category, because the indexer's
# categorizer maps only TypeScript `this.` keys to the wildcard category — so
# shape routing is the Rust equivalent of the TS wildcard-category seam (ratified
# EY3-ROUTING). Mirrors the tsserver-resolver seam: tree-sitter does deterministic
# syntax localization; rust-analyzer does semantic typing. Versions match the
# workspace (rust-extractor uses the same tree-sitter 0.24 / tree-sitter-rust 0.23).
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

[dev-dependencies]
tempfile = "3.10"
