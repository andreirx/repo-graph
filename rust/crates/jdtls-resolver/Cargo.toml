# ── jdtls-resolver ─────────────────────────────────────────────────
#
# Java receiver type resolver using Eclipse JDT Language Server (jdtls).
#
# This is an outer-layer adapter crate. It implements the
# `ReceiverTypeResolver` trait from the enrichment crate using
# jdtls as the mechanism.
#
# Architecture:
#   - Uses lsp-subprocess for LSP transport (shared with rust-analyzer-resolver)
#   - Direct jdtls subprocess (no wrapper)
#   - Java project detection: Maven > Gradle > Eclipse > fallback
#   - Separates module root (nearest build file) from workspace launch root
#
# Project detection:
#   Module grouping: nearest pom.xml / build.gradle* / .project
#   Workspace root: may be promoted to enclosing settings.gradle*
#
# This crate is volatile — it depends on jdtls behavior and
# may need updates when Eclipse releases change the protocol.
# The enrichment crate remains stable and does not import this.
#
# PROVISIONAL: Java defaults are more generous than rust-analyzer
# due to JVM startup + dependency resolution overhead. These are
# configurable and documented as provisional, not canonical.

[package]
name         = "jdtls-resolver"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.93.0"
license      = "MIT"
description  = "Java receiver type resolver using Eclipse JDT Language Server"
publish      = false

[dependencies]
# Shared LSP subprocess transport
lsp-subprocess = { path = "../lsp-subprocess" }

# LSP protocol types (request/response structs)
lsp-types = "0.95"

# Enrichment crate — for ReceiverTypeResolver trait and DTOs.
# Dependency direction: adapter → policy (outer → inner).
enrichment = { path = "../enrichment" }

# Serde for configuration and response parsing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling.
thiserror = "2"

# Logging.
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
