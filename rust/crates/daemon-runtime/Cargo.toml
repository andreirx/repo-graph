# ── repo-graph-daemon-runtime ───────────────────────────────────────
#
# Daemon service runtime for repo-graph.
#
# Responsibility: service bootstrap, state management, request dispatch,
# and the main daemon loop. This is the shared runtime that both rmap
# (compatibility shim) and rmapd (dedicated binary) use.
#
# NOT policy. NOT transport. This is the orchestration layer that wires
# together transport, policy, storage, and application services.
#
# Created for RMAPD-1 slice to establish correct dependency direction:
#   - rmapd depends on daemon-runtime (primary host)
#   - rmap depends on daemon-runtime (deprecated compatibility shim)
#   - Neither binary owns the daemon logic

[package]
name                = "repo-graph-daemon-runtime"
version.workspace   = true
edition.workspace   = true
rust-version.workspace = true
license.workspace   = true
description         = "Daemon service runtime for repo-graph"
publish             = false

[features]
default = []
# RMAPD-PERF-1: Enable performance tracing to stderr.
# Build with: cargo build --features perf-trace
# Or: cargo build --release --features perf-trace
perf-trace = []

[dependencies]
# Transport and policy layers
repo-graph-daemon-transport = { path = "../daemon-transport" }
repo-graph-daemon-policy = { path = "../daemon-policy" }

# Storage layer
repo-graph-storage = { path = "../storage" }

# Application services (used by dispatcher)
repo-graph-repo-index = { path = "../repo-index" }
repo-graph-agent = { path = "../agent" }
repo-graph-trust = { path = "../trust" }
repo-graph-gate = { path = "../gate" }
repo-graph-doc-facts = { path = "../doc-facts" }
repo-graph-module-queries = { path = "../module-queries" }
repo-graph-boundary-interaction = { path = "../boundary-interaction" }
repo-graph-classification = { path = "../classification" }

# Git operations (churn, hotspots, risk)
repo-graph-git = { path = "../git" }

# Coverage parsing (coverage import)
repo-graph-coverage = { path = "../coverage" }

# Quality policy assessment (assess command)
repo-graph-quality-policy-runner = { path = "../quality-policy-runner" }

# Enrichment pipeline and resolvers
enrichment = { path = "../enrichment" }
rust-analyzer-resolver = { path = "../rust-analyzer-resolver" }
tsserver-resolver = { path = "../tsserver-resolver" }
jdtls-resolver = { path = "../jdtls-resolver" }

# Utilities
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12.5"
dirs = "6"
ulid = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
