# ── repo-graph-daemon-runtime ───────────────────────────────────────
#
# Daemon service runtime for repo-graph.
#
# Responsibility: service bootstrap, state management, request dispatch,
# and the main daemon loop. This is the shared runtime that both rmap
# (compatibility shim) and rmapd (dedicated binary) use.
#
# NOT policy. NOT transport. This is the orchestration layer that wires
# together transport, policy, storage, and application services.
#
# Created for RMAPD-1 slice to establish correct dependency direction:
#   - rmapd depends on daemon-runtime (primary host)
#   - rmap depends on daemon-runtime (deprecated compatibility shim)
#   - Neither binary owns the daemon logic

[package]
name                = "repo-graph-daemon-runtime"
version.workspace   = true
edition.workspace   = true
rust-version.workspace = true
license.workspace   = true
description         = "Daemon service runtime for repo-graph"
publish             = false

[features]
default = []
# RMAPD-PERF-1: Enable performance tracing to stderr.
# Build with: cargo build --features perf-trace
# Or: cargo build --release --features perf-trace
perf-trace = []

[dependencies]
# Transport and policy layers
repo-graph-daemon-transport = { path = "../daemon-transport" }
repo-graph-daemon-policy = { path = "../daemon-policy" }

# Storage layer
repo-graph-storage = { path = "../storage" }

# Application services (used by dispatcher)
repo-graph-repo-index = { path = "../repo-index" }
repo-graph-agent = { path = "../agent" }
repo-graph-trust = { path = "../trust" }
repo-graph-gate = { path = "../gate" }
repo-graph-doc-facts = { path = "../doc-facts" }
repo-graph-module-queries = { path = "../module-queries" }
repo-graph-boundary-interaction = { path = "../boundary-interaction" }
repo-graph-classification = { path = "../classification" }

# LiveGraph runtime + ingestion feed (LIVEGRAPH-INTEGRATION-1B: flag-gated serving from preloaded state).
# The daemon may DECODE a supplied .scip and feed it; it must NOT run scip-typescript (that is 1C).
# Pure domain IR (PartitionIr) — named directly by the warm-cache seam (WARM-CACHE-DAEMON-WIRING-1).
repo-graph-ir = { path = "../repo-graph-ir" }
repo-graph-livegraph = { path = "../repo-graph-livegraph" }
repo-graph-livegraph-feed = { path = "../repo-graph-livegraph-feed" }
repo-graph-scip-ingest = { path = "../repo-graph-scip-ingest" }
repo-graph-trust-model = { path = "../repo-graph-trust-model" }
# ORIENT-LIVEGRAPH-IMPL: the coherence answer-wrapper. The daemon assembles orient's
# CoherenceEnvelope<CoherentOrientResult> response (orient_coherence.rs): it maps the LiveGraph
# fastpath FallbackReason -> CoherenceFallbackReason and supplies per-leaf decisions to the agent's
# pure `to_coherent`. Outer (daemon) -> inner (pure DTO) edge.
repo-graph-coherence = { path = "../repo-graph-coherence" }
# WARM-CACHE-DAEMON-WIRING-1: validated PartitionIr cache on the refresh path (non-authoritative).
repo-graph-warm-cache = { path = "../repo-graph-warm-cache" }
# WARM-CACHE-VALUEFACTS-1: ValueFact <-> CacheValueFactDto adapter + value-facts warm-load feed.
repo-graph-warm-cache-feed = { path = "../repo-graph-warm-cache-feed" }

# Git operations (churn, hotspots, risk)
repo-graph-git = { path = "../git" }

# Coverage parsing (coverage import)
repo-graph-coverage = { path = "../coverage" }

# Quality policy assessment (assess command)
repo-graph-quality-policy-runner = { path = "../quality-policy-runner" }

# Policy facts (policy command)
repo-graph-policy-facts = { path = "../policy-facts" }

# Enrichment pipeline and resolvers
enrichment = { path = "../enrichment" }
rust-analyzer-resolver = { path = "../rust-analyzer-resolver" }
tsserver-resolver = { path = "../tsserver-resolver" }
jdtls-resolver = { path = "../jdtls-resolver" }

# Platform paths (shared with rgr)
repo-graph-platform-paths = { path = "../platform-paths" }

# Utilities
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12.5"
ulid = "1"
sha2 = "0.10"
hex = "0.4"

# Unix-specific dependencies (sandbox cleanup)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# DAEMON-CANCEL-3 (tests/fixtures only): inject `unresolved_edges` so the trust/check
# in-flight cancellation tests exercise the real 100k-sample chokepoint. INDEX-BASIS-1
# (RULING 3) also uses its `SnapshotLifecyclePort` write trait in `tests/index_basis.rs`
# to persist a synthetic `index_basis` diagnostic for the head-unreadable/pre-slice render
# proofs. Dev-only edge (no production dependency, no cycle — indexer does not depend on
# daemon-runtime).
repo-graph-indexer = { path = "../indexer" }
