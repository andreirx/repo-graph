# Boundary Interaction Binding Table
#
# Contract: docs/design/boundary-interaction-ipc-device.md section 7
#
# This table defines which C API calls indicate boundary interactions.
# Extractors use this to recognize IPC patterns and emit boundary facts.
#
# Slice 1A scope (local IPC, inter_process):
#   - Unix domain sockets (AF_UNIX)
#   - Named pipes / FIFOs
#   - Anonymous pipes
#   - POSIX shared memory
#   - POSIX message queues
#
# BI-1B scope (raw sockets, unknown/inter_device):
#   - TCP sockets (AF_INET/AF_INET6 + SOCK_STREAM)
#   - UDP sockets (AF_INET/AF_INET6 + SOCK_DGRAM)
#
# IMPORTANT: Binding order matters. For functions with multiple channel_kind
# candidates (e.g., socket → unix_socket, tcp_socket, udp_socket), candidates
# are evaluated in TOML declaration order. List Unix sockets first so AF_UNIX
# takes precedence.

# ════════════════════════════════════════════════════════════════════════
# UNIX DOMAIN SOCKETS
# ════════════════════════════════════════════════════════════════════════
#
# Detection: socket(AF_UNIX, ...) followed by bind/connect/listen
# The socket() call alone is setup; direction comes from bind vs connect.
# Scope: always inter_process (Unix sockets are local by definition)

[[binding]]
language = "c"
api_family = "posix_socket"
function = "socket"
role = "setup"
channel_kind = "unix_socket"
scope_heuristic = "arg_family"
interaction_pattern = "stream"
basis = "api_call"
arg_index = 0
notes = "Socket creation. Check arg0 for AF_UNIX to classify as Unix socket."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "bind"
role = "provider"
channel_kind = "unix_socket"
scope_heuristic = "sockaddr"
interaction_pattern = "stream"
basis = "api_call"
arg_index = 1
notes = "Bind socket to address. For Unix sockets, arg1 sockaddr_un contains path."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "listen"
role = "provider"
channel_kind = "unix_socket"
scope_heuristic = "fixed"
fixed_scope = "inter_process"
interaction_pattern = "stream"
basis = "api_call"
notes = "Mark socket as passive listener. Confirms provider role."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "accept"
role = "provider"
channel_kind = "unix_socket"
scope_heuristic = "fixed"
fixed_scope = "inter_process"
interaction_pattern = "stream"
basis = "api_call"
notes = "Accept incoming connection. Provider side."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "connect"
role = "consumer"
channel_kind = "unix_socket"
scope_heuristic = "sockaddr"
interaction_pattern = "stream"
basis = "api_call"
arg_index = 1
notes = "Connect to remote socket. For Unix sockets, arg1 contains path."

# ════════════════════════════════════════════════════════════════════════
# TCP SOCKETS (BI-1B)
# ════════════════════════════════════════════════════════════════════════
#
# Detection: socket(AF_INET/AF_INET6, SOCK_STREAM, ...) followed by bind/connect/listen
# Scope: unknown by default — may be inter_process (loopback) or inter_device (remote)
# The emitter must analyze endpoint literals for loopback hints (127.0.0.1, ::1)
#
# Listed AFTER Unix sockets so AF_UNIX takes precedence in multi-candidate selection.

[[binding]]
language = "c"
api_family = "posix_socket"
function = "socket"
role = "setup"
channel_kind = "tcp_socket"
scope_heuristic = "arg_family"
interaction_pattern = "stream"
basis = "api_call"
arg_index = 0
notes = "Socket creation. Requires AF_INET/AF_INET6 + SOCK_STREAM for TCP."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "bind"
role = "provider"
channel_kind = "tcp_socket"
scope_heuristic = "sockaddr"
interaction_pattern = "stream"
basis = "api_call"
arg_index = 1
notes = "Bind socket to address. For TCP, arg1 sockaddr_in contains IP:port."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "listen"
role = "provider"
channel_kind = "tcp_socket"
scope_heuristic = "fixed"
fixed_scope = "unknown"
interaction_pattern = "stream"
basis = "api_call"
notes = "Mark socket as passive listener. Confirms provider role."

[[binding]]
