api_family = "atomics"
function = "SharedArrayBuffer"
role = "provider"
channel_kind = "shared_array_buffer"
scope_heuristic = "fixed"
fixed_scope = "intra_process"
interaction_pattern = "shared_state"
basis = "api_call"
notes = "SharedArrayBuffer allocation. Provider role: creates the shared memory region. DUAL PROJECTION REQUIRED."

