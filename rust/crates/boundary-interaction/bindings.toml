#
# Detection: amqplib direct library usage in JavaScript/TypeScript.
# Patterns: sendToQueue, publish, consume, assertQueue, assertExchange, bindQueue.
#
# Scope: unknown by default (broker endpoint may be local or remote).
# Transport: message_broker.
# Interaction: fire_and_forget (no direct reply expected on same channel).
#
# Contract: docs/slices/mb-1a-rabbitmq-amqp.md

# ── Publisher patterns ────────────────────────────────────────────────

[[binding]]
language = "typescript"
api_family = "amqplib"
function = "sendToQueue"
role = "provider"
channel_kind = "amqp_queue"
scope_heuristic = "fixed"
fixed_scope = "unknown"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 0
notes = "channel.sendToQueue(queue, msg) - direct queue publish. Arg0 is queue name."

[[binding]]
language = "typescript"
api_family = "amqplib"
function = "publish"
role = "provider"
channel_kind = "amqp_queue"
scope_heuristic = "fixed"
fixed_scope = "unknown"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 0
notes = "channel.publish(exchange, routingKey, msg) - exchange publish. Arg0 is exchange, arg1 is routing key."

