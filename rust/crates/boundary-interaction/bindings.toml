# ════════════════════════════════════════════════════════════════════════
# SHAREDARRAYBUFFER / ATOMICS BOUNDARIES (BI-1C)
# ════════════════════════════════════════════════════════════════════════
#
# Detection: SharedArrayBuffer creation and Atomics.* synchronization calls.
#
# Scope: intra_process (same OS process, different V8 isolates/execution contexts)
# Transport: raw_ipc (SharedArrayBuffer is fundamentally shared memory)
# Interaction: shared_state (concurrent access to same memory region)
#
# NOTE: Worker and postMessage are NOT included here. They indicate worker
# communication but are not provably SAB-related without dataflow analysis.
# A future BI-1E (Web Worker) slice may cover general worker patterns.
#
# NOTE: Requires dual projection per design doc section 4.4 (boundary + state)

# ── SharedArrayBuffer creation ────────────────────────────────────────

