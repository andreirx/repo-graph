function = "accept"
role = "provider"
channel_kind = "tcp_socket"
scope_heuristic = "fixed"
fixed_scope = "unknown"
interaction_pattern = "stream"
basis = "api_call"
notes = "Accept incoming connection. Provider side."

[[binding]]
language = "c"
api_family = "posix_socket"
function = "connect"
role = "consumer"
channel_kind = "tcp_socket"
scope_heuristic = "sockaddr"
interaction_pattern = "stream"
basis = "api_call"
arg_index = 1
notes = "Connect to remote socket. For TCP, arg1 contains IP:port."

[[binding]]
