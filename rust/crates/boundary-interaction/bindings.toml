# ════════════════════════════════════════════════════════════════════════
# PROCESS SIGNALS (BI-1D)
# ════════════════════════════════════════════════════════════════════════
#
# Detection: kill/raise/sigqueue for senders, signal/sigaction for handlers
# Scope: inter_process for kill (PID != self), intra_process for raise
# Direction: provider for senders, consumer for handlers
# Interaction: fire_and_forget (signals are inherently async, no response)
#
# Channel identity: signal name/number (SIGTERM, SIGUSR1, etc.)

# ── Signal senders ────────────────────────────────────────────────────

[[binding]]
language = "c"
api_family = "posix_signal"
function = "kill"
role = "provider"
channel_kind = "process_signal"
scope_heuristic = "fixed"
fixed_scope = "inter_process"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 1
notes = "Send signal to process. Arg0 is PID, arg1 is signal number."

[[binding]]
language = "c"
api_family = "posix_signal"
function = "killpg"
role = "provider"
channel_kind = "process_signal"
scope_heuristic = "fixed"
fixed_scope = "inter_process"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 1
notes = "Send signal to process group. Arg0 is PGRP, arg1 is signal number."

[[binding]]
language = "c"
api_family = "posix_signal"
function = "raise"
role = "provider"
channel_kind = "process_signal"
scope_heuristic = "fixed"
fixed_scope = "intra_process"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 0
notes = "Send signal to self. Arg0 is signal number. Intra-process only."

[[binding]]
language = "c"
api_family = "posix_signal"
function = "sigqueue"
role = "provider"
channel_kind = "process_signal"
scope_heuristic = "fixed"
fixed_scope = "inter_process"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 1
notes = "Send signal with payload. Arg0 is PID, arg1 is signal number."

[[binding]]
language = "c"
api_family = "posix_signal"
function = "pthread_kill"
role = "provider"
channel_kind = "process_signal"
scope_heuristic = "fixed"
fixed_scope = "intra_process"
interaction_pattern = "fire_and_forget"
basis = "api_call"
arg_index = 1
notes = "Send signal to thread. Arg0 is thread, arg1 is signal number."

# ── Signal handlers/receivers ─────────────────────────────────────────

