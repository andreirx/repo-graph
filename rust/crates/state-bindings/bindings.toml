# ── C++ standard library streams ───────────────────────────────────
#
# CPP-SB-1: std::fstream family. Stream type determines direction
# unless explicit mode flags are present.
#
# Constructor symbols:
#   - ifstream → read (std::ifstream f("path"))
#   - ofstream → write (std::ofstream f("path"))
#   - fstream → read_write default, or mode-specific
#
# Open method symbols (via D3 intra-function local type map):
#   - ifstream_open → read (file.open("path") where file is ifstream)
#   - ofstream_open → write
#   - fstream_open → read_write default
#   - fstream_read → read (explicit std::ios::in)
#   - fstream_write → write (explicit std::ios::out/app/trunc)
#   - fstream_unknown → unknown (HONESTY-GATE-2 review-3: an explicit mode
#     argument the extractor could not recognize — a dynamic variable, a
#     typo, a near-name token, or direction-less modifiers only — is
#     undetermined, NOT a guessed read_write). Contract-fixed no-argument
#     defaults still resolve to `fstream`/`fstream_open` (read_write).

[[binding]]
language      = "cpp"
module        = "std:fstream"
symbol_path   = "ifstream"
resource_kind = "fs"
driver        = "libstdc++"
direction     = "read"
basis         = "stdlib_api"

[[binding]]
language      = "cpp"
module        = "std:fstream"
symbol_path   = "ifstream_open"
resource_kind = "fs"
driver        = "libstdc++"
direction     = "read"
basis         = "stdlib_api"

