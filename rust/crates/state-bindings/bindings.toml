symbol_path   = "ofstream"
resource_kind = "fs"
driver        = "libstdc++"
direction     = "write"
basis         = "stdlib_api"

[[binding]]
language      = "cpp"
module        = "std:fstream"
symbol_path   = "ofstream_open"
resource_kind = "fs"
driver        = "libstdc++"
direction     = "write"
basis         = "stdlib_api"

[[binding]]
