# ── C libc:stdio (fopen family) ────────────────────────────────────
#
# C-SB-1: fopen with mode-normalized direction symbols. The C
# extractor parses the mode argument and normalizes to direction-
# specific symbols:
#   - 'r', 'rb' → fopen_read
#   - 'w', 'wb', 'a', 'ab', 'x' → fopen_write
#   - 'r+', 'w+', etc. → fopen_read_write
#   - undetermined mode (dynamic/unrecognized) → fopen_unknown
#     (HONESTY-GATE-2 family 1: an undetermined mode is `unknown`,
#     never a guessed `read`).
# This mirrors the Python adapter's mode normalization pattern.

[[binding]]
language      = "c"
module        = "libc:stdio"
symbol_path   = "fopen_read"
resource_kind = "fs"
driver        = "libc"
direction     = "read"
basis         = "stdlib_api"

[[binding]]
language      = "c"
module        = "libc:stdio"
symbol_path   = "fopen_unknown"
resource_kind = "fs"
driver        = "libc"
direction     = "unknown"
basis         = "stdlib_api"

[[binding]]
language      = "c"
module        = "libc:stdio"
symbol_path   = "fopen_write"
resource_kind = "fs"
driver        = "libc"
direction     = "write"
basis         = "stdlib_api"

[[binding]]
language      = "c"
module        = "libc:stdio"
symbol_path   = "fopen_read_write"
resource_kind = "fs"
driver        = "libc"
direction     = "read_write"
basis         = "stdlib_api"

# ── C libc:fcntl (POSIX open family) ───────────────────────────────
#
# C-SB-1: POSIX open() with flag-pattern-based direction. The C
# extractor matches flag names in the source to determine direction:
#   - O_RDONLY → open_read
#   - O_WRONLY → open_write
#   - O_RDWR → open_read_write
#   - undetermined flags (dynamic/unrecognized) → open_unknown
#     (HONESTY-GATE-2 family 1: an undetermined mode is `unknown`,
#     never a guessed `read_write` — the default that fabricated
#     hadoop's phantom writers and 5-of-6 phantom readers).

[[binding]]
language      = "c"
module        = "libc:fcntl"
symbol_path   = "open_read"
resource_kind = "fs"
driver        = "libc"
direction     = "read"
basis         = "stdlib_api"

[[binding]]
language      = "c"
module        = "libc:fcntl"
symbol_path   = "open_unknown"
resource_kind = "fs"
driver        = "libc"
direction     = "unknown"
basis         = "stdlib_api"

[[binding]]
language      = "c"
module        = "libc:fcntl"
symbol_path   = "open_write"
resource_kind = "fs"
driver        = "libc"
direction     = "write"
basis         = "stdlib_api"

[[binding]]
language      = "c"
module        = "libc:fcntl"
symbol_path   = "open_read_write"
resource_kind = "fs"
driver        = "libc"
direction     = "read_write"
basis         = "stdlib_api"

