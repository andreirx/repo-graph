# ── repo-graph-cpp-extractor ───────────────────────────────────────
#
# Rust-native C++ extractor using tree-sitter-cpp.
#
# Extracts:
#   - FILE nodes
#   - SYMBOL nodes: namespaces, classes, structs, enums, methods,
#     constructors, destructors, functions, type aliases
#   - IMPORTS edges from #include directives
#   - CALLS edges from direct call sites
#   - IMPLEMENTS edges from base class clauses
#   - Cyclomatic complexity metrics
#   - C ABI boundary evidence (extern "C" linkage)
#
# Does NOT extract:
#   - Template instantiation semantics
#   - Overload resolution
#   - Macro-expanded code (source-truth semantics)
#   - compile_commands.json integration (Layer 2)
#   - Semantic enrichment (Layer 3)
#
# See docs/milestones/cpp-extractor-v1.md for full design decisions.

[package]
name         = "repo-graph-cpp-extractor"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.70.0"
license      = "MIT"
description  = "C++ language extractor for repo-graph using tree-sitter"
publish      = false

[dependencies]
repo-graph-indexer = { path = "../indexer" }
repo-graph-classification = { path = "../classification" }
tree-sitter = "0.24"
tree-sitter-cpp = "0.23"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
