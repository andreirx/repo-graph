# ── repo-graph-agent ─────────────────────────────────────────────
#
# Use-case crate for the agent orientation surface (`orient`,
# `check`, `explain`). Pure Rust aggregation returning typed DTOs.
# No CLI wiring. No binary target.
#
# Milestone scope (Rust-42):
#   - crate skeleton
#   - DTO contract (`rgr.agent.v1`)
#   - `AgentStorageRead` port (policy-side read interface)
#   - repo-level `orient(storage, repo_uid, None, budget)`
#   - ranking, budget truncation, confidence, limits
#   - typed signal evidence (no `serde_json::Value` escape hatch)
#   - direct SQL fakes for use-case tests
#
# Explicit deferrals (see docs/architecture/agent-orientation-contract.md):
#   - module/path focus (Rust-44)
#   - symbol focus (Rust-45)
#   - `check` and `explain` use cases
#   - CLI wiring and binary rename (Rust-43)
#   - GATE_* signal emission (blocked on gate.rs relocation — see
#     docs/TECH-DEBT.md; Rust-42 emits GATE_UNAVAILABLE limit)
#   - Daemon socket transport
#
# ── Architecture ──────────────────────────────────────────────────
#
# This crate is POLICY code. It follows the Clean Architecture
# dependency rule: policy defines the interface, mechanism
# implements it. Specifically:
#
#   - `repo-graph-agent` defines the `AgentStorageRead` trait.
#     That trait lives in this crate, not in `repo-graph-storage`,
#     because the policy layer owns the interface definition.
#
#   - `repo-graph-storage` (adapter) adds `repo-graph-agent` as a
#     dependency and implements the trait on `StorageConnection`.
#     The dependency direction is adapter → policy (outer → inner).
#
#   - `repo-graph-agent` does NOT depend on `repo-graph-storage`,
#     `rusqlite`, or any tree-sitter/indexer crate. It has no
#     knowledge of SQLite, SQL, or row mapping.
#
#   - `repo-graph-agent` does NOT depend on `repo-graph-trust`
#     directly. Trust data reaches orient through the
#     `AgentStorageRead::get_trust_summary` port method, which
#     returns an agent-owned `AgentTrustSummary` DTO. The storage
#     impl is responsible for assembling trust internally.
#
# This matches the exact pattern used by `repo-graph-trust` for
# its `TrustStorageRead` port.

[package]
name         = "repo-graph-agent"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.93.0"
license      = "MIT"
description  = "Use-case crate for the repo-graph agent orientation surface"
publish      = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Coherence support crate — added in ORIENT-LIVEGRAPH-IMPL. The agent
# crate is the home of `CoherentOrientResult` (COHERENCE-LAYER-1 D7):
# the coherence command-container references agent DTOs (`Signal`,
# `Focus`, `Confidence`, …), so it CANNOT live in the pure inner
# `repo-graph-coherence` crate (that would invert the dependency rule).
# This crate therefore depends on `repo-graph-coherence` (outer → inner;
# coherence is pure DTO/domain and depends only on `repo-graph-trust-model`).
# This is the RATIFIED edge (selection packet, operator 2026-06-09:
# "orient … depend on it"). It does NOT pull in `repo-graph-trust`: the
# `trust_briefing` overlay is carried as an opaque `serde_json::Value`
# (D-ORIENT-6 CRATE-HOME option c), preserving the documented
# no-dependency-on-`repo-graph-trust` boundary below.
repo-graph-coherence = { path = "../repo-graph-coherence" }

# Classification substrate — added in ATTRIBUTION-1 (operator-RATIFIED
# 2026-07-15, ATTR1-MAPPING-BOUNDARY option A). `attribution.rs` owns the ONE
# typed, compile-fail-exhaustive `UnresolvedEdgeBasisCode → AttributionClass`
# match (slice §1.4 "one shared mapping module"), so it must NAME the classifier
# enum. `repo-graph-classification` is an inner leaf crate (deps: serde +
# serde_json + repo-graph-coverage) consumed by indexer / daemon-runtime /
# extractors; `agent → classification` is outer → inner per the dependency rule,
# and cycle-free (classification has no edge back to agent — verified). This does
# NOT relax the documented no-dependency-on-`repo-graph-trust` boundary below:
# the wire basis code arrives as a `String` and is parsed to the typed enum here.
repo-graph-classification = { path = "../classification" }

# Gate crate — added in Rust-43A. The agent orient pipeline
# emits GATE_PASS / GATE_FAIL / GATE_INCOMPLETE signals by
# calling `repo_graph_gate::assemble_from_requirements`. This
# is a policy → policy dependency; `repo-graph-gate` itself
# has no dependency on this crate (no reverse edge).
repo-graph-gate = { path = "../gate" }

[dev-dependencies]
# Agent integration tests use a fake `AgentStorageRead` that
# ALSO implements `GateStorageRead`, so the fake needs visibility
# into the gate crate's types (GateRequirement, etc.). Listing
# it here keeps production builds unchanged — the dev-dep
# declaration is a no-op for them because `repo-graph-gate` is
# already a normal dependency above — but clarifies intent
# for test readers.
repo-graph-gate = { path = "../gate" }
