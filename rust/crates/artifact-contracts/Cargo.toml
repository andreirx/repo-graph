[package]
name = "artifact-contracts"
version = "0.1.0"
edition = "2021"
description = "Canonical artifact contract registry for repo-graph"

# This crate defines the artifact ontology: truth classes, refresh policies,
# identity models, degradation policies, provenance requirements, and freshness
# tracking. It is the authority for how each artifact family behaves during
# refresh and query operations.
#
# See docs/architecture/artifact-contract-model.md for the full specification.

[dependencies]
# Minimal dependencies - this is a pure data/policy crate
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"  # For Provenance.extraction_context flexibility

[dev-dependencies]
# None needed yet - tests use standard assertions
