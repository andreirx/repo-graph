# ── repo-graph-repo-index ──────────────────────────────────────────
#
# Outer-layer composition crate: indexes a real repo from disk
# into SQLite. Owns filesystem scanning, config reading, content
# hashing, FileInput assembly, and composition wiring.
#
# Slice scope (Rust-7A):
#   - full-index-from-disk only (no refresh-from-disk)
#   - no CLI entry point
#   - no trust auto-computation
#   - no new inward ports
#
# Architecture:
#   - Outermost crate. Depends on all adapter and policy crates.
#   - No existing crate depends on this one.
#   - All new code is outer mechanism (scanning, config, wiring).
#   - Policy crates remain unchanged.
#
# ── Hash algorithm (locked) ──────────────────────────────────────
#
# SHA-256 of UTF-8 source bytes, hex-encoded, truncated to first
# 16 characters. Matches TS `hashContent` at repo-indexer.ts:2877:
#   createHash("sha256").update(content).digest("hex").slice(0, 16)
#
# ── Config lookup rules (locked) ─────────────────────────────────
#
# package.json: walk from file's directory upward to repo root.
#   First package.json found wins. Language-aware: only for
#   JS/TS files (not Rust/Java/Python). Reads dependencies,
#   devDependencies, peerDependencies, optionalDependencies.
#   Names collected as sorted unique set.
#
# tsconfig.json: walk from file's directory upward to repo root.
#   First tsconfig.json found wins. Follows `extends` chains
#   (relative paths only, max depth 10). First `compilerOptions.paths`
#   in the chain wins (child replaces parent entirely).

[package]
name         = "repo-graph-repo-index"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.93.0"
license      = "MIT"
description  = "Outer composition: index a repo from disk into SQLite"
publish      = false

[dependencies]
# Policy + adapter crates.
repo-graph-indexer = { path = "../indexer" }
repo-graph-storage = { path = "../storage" }
# Artifact contract registry (ACR-2): drives refresh policy dispatch.
artifact-contracts = { path = "../artifact-contracts" }
repo-graph-trust = { path = "../trust" }
repo-graph-ts-extractor = { path = "../ts-extractor" }
repo-graph-c-extractor = { path = "../c-extractor" }
repo-graph-cpp-extractor = { path = "../cpp-extractor" }
repo-graph-java-extractor = { path = "../java-extractor" }
repo-graph-python-extractor = { path = "../python-extractor" }
repo-graph-rust-extractor = { path = "../rust-extractor" }
repo-graph-classification = { path = "../classification" }
# State-boundary composition wiring (SB-4-pre).
repo-graph-state-bindings  = { path = "../state-bindings" }
repo-graph-state-extractor = { path = "../state-extractor" }
# Policy-facts extraction (PF-1).
# TEMPORARY: Re-parses C files as a postpass. Target architecture is
# extraction-time integration when C extractor carries policy-fact output.
# See docs/TECH-DEBT.md: "PF-1 temporary re-parse postpass".
repo-graph-policy-facts = { path = "../policy-facts" }
# Boundary-interaction extraction (BI-1A).
# TEMPORARY: Re-parses C files as a postpass. Same architecture as PF-1.
# See docs/TECH-DEBT.md: "Boundary Interaction Extraction — Slice 1A".
repo-graph-boundary-interaction = { path = "../boundary-interaction" }
repo-graph-boundary-interaction-extractor = { path = "../boundary-interaction-extractor" }

# Filesystem walking + full git ignore semantics (anchoring, negation, nested
# `.gitignore`, `.git/info/exclude`) via `ignore::WalkBuilder`. See scanner.rs.
# (Replaced the prior `walkdir` + root-only `Gitignore` loader — SCANNER-GITIGNORE-1.)
ignore = "0.4"

# SHA-256 for content hashing (locked to match TS hashContent).
sha2 = "0.10"

# Serde for config file parsing (package.json, tsconfig.json).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Glob pattern expansion for Cargo workspace members.
glob = "0.3"

# Timestamps for inference provenance.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# UUID generation for inference UIDs.
uuid = { version = "1", features = ["v4"] }

# Tree-sitter for PF-1 policy-facts re-parse postpass (TEMPORARY).
# See docs/TECH-DEBT.md: "PF-1 temporary re-parse postpass".
tree-sitter = "0.24"
tree-sitter-c = "0.23"
# Tree-sitter for BI-1C SharedArrayBuffer/Worker boundary detection (TEMPORARY).
tree-sitter-typescript = "0.23"
# Tree-sitter for HTTP-BOUNDARY-1 Java HTTP-client (RestTemplate/WebClient/HttpClient)
# consumer re-parse postpass. Same grammar version java-extractor uses.
tree-sitter-java = "0.23"

[features]
default = []
# Enable PERF timing instrumentation for refresh path diagnosis.
# Logs to stderr (daemon.log). Use for debugging refresh performance.
perf-trace = []

[dev-dependencies]
tempfile = "3"
# Raw-row inspection for the EC-1 M-3a parity suite
# (tests/call_aggregate_parity.rs): the persisted-vs-live comparison
# reads the SQLite artifact directly through a second connection —
# storage diagnostics, deliberately NOT a production read surface.
# Same version/features as the storage crate (one bundled libsqlite3).
rusqlite = { version = "0.31", features = ["bundled"] }
